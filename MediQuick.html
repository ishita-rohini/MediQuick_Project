<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediQuick</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f6faf9;color:#17332e}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none}header{height:72px;background:#fff;border-bottom:1px solid #e4eeeb;display:flex;align-items:center;padding:0 6%;gap:35px;position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer}.brand svg{color:#12a57d}.brand span{color:#0ca982}nav{display:flex;gap:22px;flex:1}nav button:hover,.link{color:#0b9d7a}.actions{display:flex;gap:12px}.actions button{display:flex;align-items:center;gap:5px}.mobile{display:none}main{max-width:1180px;margin:auto;padding:55px 24px;min-height:650px}.hero{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:60px;padding:70px 0}.eyebrow{letter-spacing:2px;font-size:12px;font-weight:800;color:#0ca982}.hero h1{font-size:70px;line-height:.98;margin:15px 0}.hero h1 span{color:#0ca982}.hero p{font-size:18px;color:#607570;max-width:600px}.heroCard{background:#dff7ef;border-radius:30px;padding:60px;text-align:center}.heroCard svg{color:#0ca982}.primary{background:#0ca982;color:#fff;padding:13px 21px;border-radius:10px;font-weight:700;margin-top:12px}.primary:hover{background:#087e63}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:70px}.features article,.card,.stats article,.order,.upload{background:#fff;border:1px solid #e4eeeb;border-radius:16px;padding:22px}.features p{color:#6b7d79;font-size:14px}.cats{display:flex;flex-wrap:wrap;gap:12px}.cats button,.chips button{background:#fff;border:1px solid #dbe8e4;border-radius:30px;padding:12px 18px}.chips{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.chips .active{background:#0ca982;color:white}.pageHead{display:flex;justify-content:space-between;align-items:center;gap:20px}.search{background:#fff;border:1px solid #dbe8e4;border-radius:12px;padding:12px;display:flex;gap:8px;min-width:350px}.search input{border:0;outline:0;width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{overflow:hidden;padding:0}.card img{width:100%;height:190px;object-fit:cover}.cardbody{padding:20px}.cardbody small{color:#71847f}.cardbody p{color:#71847f;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.low{color:#d77a00}.badge{font-size:11px;background:#fff0e2;padding:5px 8px;border-radius:20px}.full{width:100%}.auth{display:grid;place-items:center}.auth form,.upload{width:min(430px,100%);display:flex;flex-direction:column;gap:13px}.auth input,.upload textarea,.upload input{padding:13px;border:1px solid #dbe8e4;border-radius:9px;background:#fff}.auth svg{color:#0ca982}.demo{font-size:12px;color:#71847f}.cart{position:relative;max-width:900px}.cartitem{display:flex;gap:18px;background:#fff;border:1px solid #e4eeeb;border-radius:14px;padding:15px;margin-bottom:12px;align-items:center}.cartitem img{width:90px;height:90px;object-fit:cover;border-radius:10px}.cartitem button{padding:7px 11px;background:#eef6f3;border-radius:7px;margin:4px}.cartitem .danger{background:#fff0f0;color:#b44}.summary{background:#fff;border:1px solid #e4eeeb;border-radius:16px;padding:25px;max-width:380px;margin-top:25px}.summary p{display:flex;justify-content:space-between}.empty{text-align:center;background:#fff;padding:70px 20px;border-radius:20px}.empty svg{color:#0ca982}.order{margin:14px 0}.order span{float:right;background:#e5f8f1;color:#087e63;padding:5px 9px;border-radius:20px;font-size:12px}.timeline{margin-top:15px;padding:12px;background:#f0f7f5;border-radius:8px;font-size:12px;color:#55706a}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:20px 0 40px}.stats small{color:#71847f;text-transform:uppercase}.stats h2{margin:8px 0}.toast{position:fixed;right:25px;bottom:25px;background:#17332e;color:white;padding:14px 18px;border-radius:10px;z-index:20}footer{background:#17332e;color:#dcebe7;padding:45px 7%;text-align:center}footer b{font-size:22px}@media(max-width:800px){header{padding:0 20px}.mobile{display:block;margin-left:auto}nav{display:none;position:absolute;top:72px;left:0;right:0;background:white;padding:20px;flex-direction:column}nav.show{display:flex}.actions{margin-left:0}.hero{grid-template-columns:1fr;padding:35px 0}.hero h1{font-size:52px}.features,.grid,.stats{grid-template-columns:1fr 1fr}.pageHead{flex-direction:column;align-items:stretch}.search{min-width:0}.card img{height:170px}}@media(max-width:520px){.features,.grid,.stats{grid-template-columns:1fr}.actions button:first-child{display:flex}main{padding:35px 16px}.heroCard{padding:35px}.hero h1{font-size:45px}}</style></head><body><div id="app"></div><script>const SEED_DATA={"medicines":[{"id":"m1","name":"Paracetamol 500mg","brand":"MediCare","category":"Tablets","price":35,"stock":120,"prescription":false,"description":"General fever and pain relief medicine."},{"id":"m2","name":"Vitamin C 500mg","brand":"HealthPlus","category":"Vitamins","price":120,"stock":80,"prescription":false,"description":"Vitamin supplement."},{"id":"m3","name":"Cough Relief Syrup","brand":"MediCare","category":"Syrups","price":95,"stock":45,"prescription":false,"description":"Cough relief syrup."},{"id":"m4","name":"Amoxicillin 500mg","brand":"PharmaCare","category":"Capsules","price":180,"stock":30,"prescription":true,"description":"Prescription medicine. Upload an approved prescription."},{"id":"m5","name":"First Aid Kit","brand":"SafeCare","category":"First Aid","price":299,"stock":25,"prescription":false,"description":"Basic first-aid essentials."},{"id":"m6","name":"Baby Care Pack","brand":"MediCare","category":"Baby Care","price":450,"stock":18,"prescription":false,"description":"Everyday baby-care essentials."}],"users":[],"orders":[],"prescriptions":[]};const DBKEY='mediquick_db_v1';
const seed=SEED_DATA;
let db=JSON.parse(localStorage.getItem(DBKEY)||'null')||{medicines:seed.medicines,users:[],orders:[],prescriptions:[]};
if(!db.medicines?.length) db.medicines=seed.medicines;
function save(){localStorage.setItem(DBKEY,JSON.stringify(db))}
let state={page:'home',q:'',cat:'All',cart:JSON.parse(localStorage.getItem('mediquick_cart')||'[]'),user:JSON.parse(localStorage.getItem('mediquick_user')||'null'),mobile:false};
const img=()=> 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=600&q=80';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveCart(){localStorage.setItem('mediquick_cart',JSON.stringify(state.cart))}
function toast(m){const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function go(p){state.page=p;state.mobile=false;render()}
function add(m){let x=state.cart.find(x=>x.id===m.id);if(x)x.qty++;else state.cart.push({...m,qty:1});saveCart();toast('Added to cart');render()}
function logout(){state.user=null;localStorage.removeItem('mediquick_user');go('home')}
function header(){return `<header><div class="brand" onclick="go('home')">🛡️ Medi<span>Quick</span></div><button class="mobile" onclick="state.mobile=!state.mobile;render()">${state.mobile?'✕':'☰'}</button><nav class="${state.mobile?'show':''}"><button onclick="go('home')">Home</button><button onclick="go('medicines')">Medicines</button><button onclick="go('prescription')">Prescriptions</button><button onclick="go('orders')">Orders</button><button onclick="go('admin')">Admin</button></nav><div class="actions"><button onclick="go('cart')">🛒 ${state.cart.reduce((s,x)=>s+x.qty,0)}</button>${state.user?`<button onclick="logout()">↪</button>`:`<button onclick="go('login')">👤</button>`}</div></header>`}
function footer(){return `<footer><b>MediQuick</b><p>Secure and convenient medicine delivery platform.</p><small>Academic project • Browser database mode</small></footer>`}
function home(){return `<main><section class="hero"><div><p class="eyebrow">HEALTHCARE • SIMPLIFIED</p><h1>Your health,<br/><span>delivered.</span></h1><p>Order medicines and healthcare essentials from the comfort of your home.</p><button class="primary" onclick="go('medicines')">Shop Medicines →</button></div><div class="heroCard"><div style="font-size:64px">🛡️</div><h3>Trusted care</h3><p>Prescription-aware ordering and secure browser storage.</p></div></section><section class="features">${[['🚚','Fast Delivery','Track your order from placement to delivery'],['🛡️','Secure','Local browser account storage'],['💊','Wide Selection','Browse medicines by category'],['🧾','Prescription Support','Upload prescription details']].map(x=>`<article><b>${x[0]} ${x[1]}</b><p>${x[2]}</p></article>`).join('')}</section><section><h2>Popular Categories</h2><div class="cats">${['Tablets','Capsules','Syrups','Vitamins','First Aid','Baby Care'].map(c=>`<button onclick="state.cat='${c}';go('medicines')">${c}</button>`).join('')}</div></section></main>`}
function medicines(){let meds=db.medicines.filter(m=>(state.cat==='All'||m.category===state.cat)&&(!state.q||`${m.name} ${m.brand}`.toLowerCase().includes(state.q.toLowerCase())));return `<main><div class="pageHead"><div><p class="eyebrow">MEDICINE STORE</p><h2>Find what you need</h2></div><div class="search">🔎<input placeholder="Search medicines or brands..." value="${esc(state.q)}" oninput="state.q=this.value;render()"/></div></div><div class="chips">${['All','Tablets','Capsules','Syrups','Vitamins','First Aid','Baby Care'].map(c=>`<button class="${state.cat===c?'active':''}" onclick="state.cat='${c}';render()">${c}</button>`).join('')}</div><div class="grid">${meds.map(m=>`<article class="card"><img src="${img()}"/><div class="cardbody"><small>${esc(m.brand)} • ${esc(m.category)}</small><h3>${esc(m.name)}</h3><p>${esc(m.description)}</p><div class="row"><b>₹${m.price}</b><span class="${m.stock<20?'low':''}">${m.stock>0?'In stock':'Out of stock'}</span></div>${m.prescription?'<label class="badge">Prescription required</label>':''}<button class="primary full" ${!m.stock?'disabled':''} onclick='add(${JSON.stringify(m)})'>Add to Cart</button></div></article>`).join('')}</div></main>`}
function login(){return `<main class="auth"><form onsubmit="event.preventDefault();authSubmit()"><div style="font-size:42px">🛡️</div><h2>${state.register?'Create account':'Welcome back'}</h2>${state.register?'<input id="name" placeholder="Full name" required/>':''}<input id="email" type="email" placeholder="Email" required/><input id="password" type="password" placeholder="Password" required/>${state.register?'<input id="phone" placeholder="Phone"/>':''}<button class="primary full">${state.register?'Register':'Login'}</button><button type="button" class="link" onclick="state.register=!state.register;render()">${state.register?'Already have an account? Login':'Create a new account'}</button><p class="demo">Data is stored locally in this browser. Demo admin access: use email containing <b>admin</b> or create an account and open Admin.</p></form></main>`}
function authSubmit(){let email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(state.register){if(db.users.some(u=>u.email===email))return toast('Account already exists');let u={id:'u'+Date.now(),name:document.getElementById('name').value,email,password,phone:document.getElementById('phone')?.value||'',role:email.includes('admin')?'ADMIN':'USER'};db.users.push(u);save();state.user=u;localStorage.setItem('mediquick_user',JSON.stringify(u));go('home');toast('Account created')}else{let u=db.users.find(x=>x.email===email&&x.password===password);if(!u)return toast('Invalid email or password');state.user=u;localStorage.setItem('mediquick_user',JSON.stringify(u));go('home');toast('Welcome to MediQuick')}}
function cart(){let total=state.cart.reduce((s,x)=>s+x.price*x.qty,0);if(!state.cart.length)return `<main><div class="empty">🛒<h3>Your cart is empty</h3><button class="primary" onclick="go('medicines')">Browse Medicines</button></div></main>`;return `<main><h2>Shopping Cart</h2><div class="cart">${state.cart.map(x=>`<div class="cartitem"><img src="${img()}"/><div><h3>${esc(x.name)}</h3><p>₹${x.price}</p><button onclick="qty('${x.id}',-1)">−</button> ${x.qty} <button onclick="qty('${x.id}',1)">+</button><button class="danger" onclick="removeCart('${x.id}')">Remove</button></div></div>`).join('')}<aside class="summary"><h3>Order Summary</h3><p>Subtotal <b>₹${total}</b></p><p>Delivery <b>Free</b></p><hr/><h2>Total ₹${total}</h2><button class="primary full" onclick="checkout()">Place Demo Order</button></aside></div></main>`}
function qty(id,n){let x=state.cart.find(x=>x.id===id);if(x)x.qty=Math.max(1,x.qty+n);saveCart();render()} function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);saveCart();render()}
function checkout(){if(!state.user)return go('login');let total=state.cart.reduce((s,x)=>s+x.price*x.qty,0);db.orders.unshift({id:'ORD-'+Date.now(),userId:state.user.id,items:state.cart.map(x=>({...x})),total,status:'Placed',date:new Date().toLocaleString()});save();state.cart=[];saveCart();go('orders');toast('Order placed')}
function prescription(){return `<main class="auth"><div class="upload"><div style="font-size:50px">⬆️</div><h2>Upload Prescription</h2><p>JPG, PNG or PDF • Admin approval required</p><input id="rxfile" type="file" accept=".jpg,.jpeg,.png,.pdf"/><textarea id="rxnotes" placeholder="Optional notes"></textarea><button class="primary full" onclick="submitRx()">Submit Prescription</button></div></main>`}
function submitRx(){if(!state.user)return go('login');let f=document.getElementById('rxfile').files[0];if(!f)return toast('Please choose a file');db.prescriptions.unshift({id:'RX-'+Date.now(),userId:state.user.id,fileName:f.name,notes:document.getElementById('rxnotes').value,status:'Pending',date:new Date().toLocaleString()});save();toast('Prescription submitted');go('orders')}
function orders(){if(!state.user)return `<main class="empty"><h2>Please login to view orders</h2><button class="primary" onclick="go('login')">Login</button></main>`;let os=db.orders.filter(o=>o.userId===state.user.id);return `<main><h2>My Orders</h2>${!os.length?'<div class="empty">📦<p>No orders yet.</p></div>':os.map(o=>`<article class="order"><b>${o.id}</b><span>${o.status}</span><p>${o.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</p><strong>₹${o.total}</strong><div class="timeline">Placed → Confirmed → Processing → Shipped → Out for Delivery → Delivered<br/><small>${o.date}</small></div></article>`).join('')}</main>`}
function admin(){if(!state.user)return `<main class="empty"><h2>Admin login required</h2><p>Register with an email containing "admin" to use the browser demo admin.</p><button class="primary" onclick="go('login')">Login</button></main>`;let users=db.users.length,orders=db.orders.length,rx=db.prescriptions.length,revenue=db.orders.reduce((s,o)=>s+o.total,0);return `<main><div class="pageHead"><h2>Admin Dashboard</h2>🛡️</div><div class="stats">${[['users',users],['medicines',db.medicines.length],['orders',orders],['prescriptions',rx],['revenue','₹'+revenue]].map(x=>`<article><small>${x[0]}</small><h2>${x[1]}</h2></article>`).join('')}</div><h3>Prescription Management</h3>${db.prescriptions.map(p=>`<article class="order"><b>${esc(p.fileName)}</b><span>${esc(p.status)}</span><p>${esc(p.notes||'No notes')}</p></article>`).join('')||'<p>No prescriptions.</p>'}</main>`}
function render(){document.getElementById('app').innerHTML=header()+({home,medicines,login,cart,prescription,orders,admin}[state.page]||home)()+footer()}
state.register=false;render();
</script></body></html>
